<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>标签配置平台 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 360px; }
    h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 22px; }
    .field { margin-bottom: 18px; }
    label { display: block; color: #666; margin-bottom: 6px; font-size: 14px; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    input:focus { border-color: #667eea; outline: none; }
    button { width: 100%; padding: 12px; background: #667eea; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    button:hover { background: #5a6fd6; }
    .error { color: #e74c3c; text-align: center; margin-top: 15px; font-size: 14px; display: none; }
    .hint { text-align: center; color: #999; font-size: 12px; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>🏷️ 标签配置平台</h1>
    <form id="loginForm">
      <div class="field">
        <label>用户名</label>
        <input type="text" id="username" value="admin" required>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="password" value="admin123" required>
      </div>
      <button type="submit">登录</button>
      <div class="error" id="errMsg"></div>
    </form>
    <p class="hint">默认账号: admin / admin123</p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('errMsg');
      errEl.style.display = 'none';
      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username, password })
        });
        const data = await resp.json();
        if (data.code === 0) {
          localStorage.setItem('token', data.data.access_token);
          localStorage.setItem('user', JSON.stringify(data.data.user));
          window.location.href = '/static/dashboard.html';
        } else {
          errEl.textContent = data.message;
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = '网络错误: ' + err.message;
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
