<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>标签配置平台 - 首页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f5f7fa; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; }
    .header .user { font-size: 13px; }
    .header .user a { color: #fff; margin-left: 15px; text-decoration: none; border: 1px solid #fff; padding: 4px 10px; border-radius: 4px; }
    .nav { display: flex; background: #fff; border-bottom: 1px solid #e8eaed; padding: 0 30px; gap: 0; }
    .nav a { padding: 14px 20px; color: #555; text-decoration: none; font-size: 14px; border-bottom: 3px solid transparent; }
    .nav a:hover { color: #667eea; border-color: #667eea; }
    .container { padding: 30px; max-width: 1200px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
    .card { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: transform .2s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
    .card h3 { color: #333; font-size: 16px; margin-bottom: 8px; }
    .card p { color: #888; font-size: 13px; }
    .card .icon { font-size: 32px; margin-bottom: 12px; }
    .card a { color: inherit; text-decoration: none; display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏷️ 标签配置管理平台</h1>
    <div class="user">
      <span id="userName"></span>
      <a href="#" onclick="logout()">退出</a>
    </div>
  </div>
  <div class="nav">
    <a href="/static/dashboard.html">🏠 首页</a>
    <a href="/static/metadata.html">📊 元数据</a>
    <a href="/static/themes.html">🎯 业务主题</a>
    <a href="/static/relations.html">🔗 表关系</a>
    <a href="/static/enum_config.html">🏷️ 枚举</a>
    <a href="/static/datasources.html">🗄️ 数据源</a>
    <a href="/static/approvals.html">✅ 审批</a>
    <a href="/static/tag_tasks.html">📋 标签任务</a>
    <a href="/static/users.html">👤 用户角色</a>
  </div>

  <div class="container">
    <div class="grid">
      <div class="card"><a href="/static/metadata.html"><div class="icon">📊</div><h3>元数据接入</h3><p>录入表/字段，支持 Excel 导入</p></a></div>
      <div class="card"><a href="/static/relations.html"><div class="icon">🔗</div><h3>表关系配置</h3><p>配置多表 JOIN 关联规则</p></a></div>
      <div class="card"><a href="/static/enum_config.html"><div class="icon">🏷️</div><h3>字段枚举</h3><p>维护字段的枚举值映射</p></a></div>
      <div class="card"><a href="/static/datasources.html"><div class="icon">🗄️</div><h3>数据源管理</h3><p>sqlite / spark 两类数据源</p></a></div>
      <div class="card"><a href="/static/approvals.html"><div class="icon">✅</div><h3>审批工单</h3><p>三级审批：数据/技术/业务</p></a></div>
      <div class="card"><a href="/static/tag_tasks.html"><div class="icon">📋</div><h3>标签任务</h3><p>配置任务、预览 SQL、提交执行</p></a></div>
    </div>
  </div>

  <script src="/static/js/common.js"></script>
  <script>
    if (!checkLogin()) document.location.href = '/static/index.html';
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    document.getElementById('userName').textContent = user.display_name || user.username || 'Guest';
    function logout() { clearToken(); localStorage.clear(); document.location.href = '/static/index.html'; }
  </script>
</body>
</html>
