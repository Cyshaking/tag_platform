 /* V1.3: header/nav/body 样式交给 main.css + CSS 变量主题系统；只保留 dashboard 专属样式 */
 .container { padding: 30px; max-width: 1200px; margin: 0 auto; }
 .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
 .card { background: var(--card-bg, #fff); padding: 24px; border-radius: 8px; box-shadow: var(--card-shadow, 0 2px 12px rgba(0,0,0,0.08)); transition: transform .2s; }
 .card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
 .card h3 { color: var(--text-primary, #333); font-size: 16px; margin-bottom: 8px; }
 .card p { color: var(--text-muted, var(--ink-500)); font-size: 13px; }
 .card .icon { font-size: 32px; margin-bottom: 12px; }
 .card a { color: inherit; text-decoration: none; display: block; }
