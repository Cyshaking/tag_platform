<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>业务主题</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <div class="header"><h1>🏷️ 标签配置管理平台</h1>
    <div class="user"><span id="userName"></span><a href="#" onclick="logout()">退出</a></div></div>
  <div class="nav">
    <a href="/static/dashboard.html">🏠 首页</a>
    <a href="/static/metadata.html">📊 元数据</a>
    <a href="/static/themes.html">🎯 业务主题</a>
    <a href="/static/relations.html">🔗 表关系</a>
    <a href="/static/enum_config.html">🏷️ 枚举</a>
    <a href="/static/datasources.html">🗄️ 数据源</a>
    <a href="/static/approvals.html">✅ 审批</a>
    <a href="/static/tag_tasks.html">📋 标签任务</a>
    <a href="/static/users.html">👤 用户角色</a>
  </div>

  <div class="container">
    <h2>🎯 业务主题</h2>
    <p style="color:#6b7280;">业务主题是标签体系的顶层业务域，每个主题绑定一张已审批的主题表；标签任务的主表恒为主题表。</p>
    <div style="margin:15px 0;display:flex;gap:10px;">
      <button onclick="showForm()" class="btn">➕ 新建主题</button>
      <button onclick="loadData()" class="btn btn-secondary">🔄 刷新</button>
    </div>

    <div id="formBox" style="display:none;background:#fff;padding:20px;border-radius:8px;margin-bottom:20px;">
      <h3 id="formTitle">新建业务主题</h3>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;">
        <div><label>主题编码 *</label><input id="f_code" placeholder="如 POLICY_THEME"></div>
        <div><label>主题名称 *</label><input id="f_name" placeholder="如 保单主题"></div>
        <div><label>主题表（主表）*</label><select id="f_table"></select></div>
        <div><label>是否启用</label><select id="f_enabled"><option value="true">启用</option><option value="false">停用</option></select></div>
        <div style="grid-column:1/3;"><label>描述</label><input id="f_desc" placeholder="主题业务含义说明"></div>
      </div>
      <div style="margin-top:15px;">
        <button onclick="saveTheme()" class="btn btn-primary">💾 保存</button>
        <button onclick="hideForm()" class="btn btn-secondary">取消</button>
      </div>
    </div>

    <div id="themeList"></div>
  </div>

  <script src="/static/js/common.js?v=121"></script>
  <script>
    checkLogin();
    document.getElementById('userName').textContent = JSON.parse(localStorage.getItem('user')||'{}').display_name || '';
    function logout() { clearToken(); localStorage.clear(); location.href='/static/index.html'; }

    let editId = null;
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function showForm() {
      editId = null;
      ['f_code','f_name','f_desc'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('f_code').disabled = false;
      document.getElementById('f_enabled').value='true';
      document.getElementById('formTitle').textContent='新建业务主题';
      document.getElementById('formBox').style.display='block';
      try {
        const r = await apiGet('/api/metadata/tables');
        const sel = document.getElementById('f_table');
        const tables = (r.data||[]).filter(t=>t.status==='approved');
        sel.innerHTML = tables.map(t=>`<option value="${t.id}">${esc(t.table_name)}（${esc(t.table_comment||'')}）</option>`).join('');
      } catch(e) { showMsg(e.message, true); }
    }
    function hideForm(){ document.getElementById('formBox').style.display='none'; }

    async function saveTheme() {
      const body = {
        theme_code: document.getElementById('f_code').value.trim(),
        theme_name: document.getElementById('f_name').value.trim(),
        main_table_id: parseInt(document.getElementById('f_table').value),
        description: document.getElementById('f_desc').value.trim() || null,
        is_enabled: document.getElementById('f_enabled').value === 'true',
      };
      if (!body.theme_code || !body.theme_name) { showMsg('请填写主题编码与名称', true); return; }
      try {
        if (editId) {
          delete body.theme_code;
          await apiPut('/api/themes/'+editId, body);
        } else {
          await apiPost('/api/themes', body);
        }
        showMsg('已保存'); hideForm(); loadData();
      } catch(e) { showMsg(e.message, true); }
    }

    async function loadData() {
      try {
        const r = await apiGet('/api/themes');
        const data = r.data || [];
        renderTable(
          ['ID','主题编码','主题名称','主题表','描述','状态','操作'],
          data.map(t => [
            t.id, esc(t.theme_code), esc(t.theme_name),
            esc(t.main_table_name || ('#'+t.main_table_id)),
            esc(t.description || ''),
            t.is_enabled ? '<span style="color:#1a7f37;">启用</span>' : '<span style="color:#9ca3af;">停用</span>',
            `<button class="btn btn-secondary" onclick="editTheme(${t.id})">编辑</button>
             <button class="btn btn-danger" onclick="delTheme(${t.id})">删除</button>`
          ]),
          'themeList'
        );
      } catch(e) { showMsg(e.message, true); }
    }

    async function editTheme(id) {
      const r = await apiGet('/api/themes/'+id);
      const t = r.data;
      editId = id;
      await showForm();
      document.getElementById('formTitle').textContent = '编辑业务主题：' + t.theme_name;
      document.getElementById('f_code').value = t.theme_code;
      document.getElementById('f_code').disabled = true;
      document.getElementById('f_name').value = t.theme_name;
      document.getElementById('f_table').value = t.main_table_id;
      document.getElementById('f_desc').value = t.description || '';
      document.getElementById('f_enabled').value = t.is_enabled ? 'true' : 'false';
    }

    async function delTheme(id) {
      if (!confirm('确认删除该业务主题？')) return;
      try { await apiDelete('/api/themes/'+id); showMsg('已删除'); loadData(); }
      catch(e) { showMsg(e.message, true); }
    }

    loadData();
  </script>
</body>
</html>
